{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - shelley-cli Coordinator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #fff; 
            color: #1a1a1a; 
            line-height: 1.5;
        }
        
        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .logo {
            font-weight: 700;
            font-size: 18px;
            color: #1a1a1a;
            text-decoration: none;
        }
        .logo:hover { color: #1a1a1a; }
        .nav-link {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover { color: #1a1a1a; }
        .nav-link.active { color: #1a1a1a; font-weight: 600; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-success { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
        .badge-warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .badge-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-info { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .badge-neutral { background: #f5f5f5; color: #525252; border: 1px solid #e5e5e5; }
        
        /* WebSocket indicator */
        .ws-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #737373;
        }
        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }
        .ws-dot.connected { background: #22c55e; }
        .ws-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        {{template "extra_styles" .}}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/" class="logo">🏗️ shelley-cli Coordinator</a>
            <a href="/" class="nav-link{{if eq .Page "dashboard"}} active{{end}}">Dashboard</a>
            <a href="/help" class="nav-link{{if eq .Page "help"}} active{{end}}">Help</a>
        </div>
        <div class="header-right">
            {{template "header_right" .}}
        </div>
    </header>
    
    {{template "content" .}}
    
    {{template "scripts" .}}
</body>
</html>
{{end}}

{{define "extra_styles"}}{{end}}
{{define "header_right"}}{{end}}
{{define "scripts"}}{{end}}
