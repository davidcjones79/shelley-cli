<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelley Coordinator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #fff; 
            color: #1a1a1a; 
            line-height: 1.5;
        }
        
        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .logo {
            font-weight: 700;
            font-size: 18px;
            color: #1a1a1a;
        }
        .nav-link {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover { color: #1a1a1a; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            background: #fff;
            color: #1a1a1a;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { background: #f5f5f5; border-color: #d0d0d0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-group {
            display: inline-flex;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
        }
        .btn-group .btn {
            border: none;
            border-radius: 0;
            border-right: 1px solid #e5e5e5;
        }
        .btn-group .btn:last-child { border-right: none; }
        .btn-primary {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
        }
        .btn-primary:hover { background: #333; }
        .btn-success {
            background: #22c55e;
            color: #fff;
            border-color: #22c55e;
        }
        .btn-success:hover { background: #16a34a; }
        .btn-danger {
            background: #fff;
            color: #dc2626;
            border-color: #fca5a5;
        }
        .btn-danger:hover { background: #fef2f2; }
        
        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-success { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
        .badge-warning { background: #fef9c3; color: #a16207; border: 1px solid #fef08a; }
        .badge-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-info { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .badge-neutral { background: #f5f5f5; color: #525252; border: 1px solid #e5e5e5; }
        
        /* Status dot */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.running { background: #22c55e; }
        .status-dot.stopped { background: #ef4444; }
        .status-dot.idle { background: #a3a3a3; }
        .status-dot.busy { background: #3b82f6; }
        
        /* Main content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        /* Section header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #525252;
        }
        
        /* Cards/Sections */
        .section {
            margin-bottom: 32px;
        }
        
        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            padding: 20px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .stat-label {
            font-size: 13px;
            color: #737373;
            margin-top: 4px;
        }
        
        /* Table/List */
        .list {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            overflow: hidden;
        }
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e5e5;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #fafafa; }
        .list-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .list-item-name {
            font-weight: 600;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 14px;
        }
        .list-item-meta {
            font-size: 13px;
            color: #737373;
        }
        .list-item-actions {
            display: flex;
            gap: 8px;
        }
        .list-empty {
            padding: 40px;
            text-align: center;
            color: #a3a3a3;
        }
        
        /* Control panel */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .control-panel-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        
        /* Form elements */
        .input {
            padding: 8px 12px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        .input:focus { border-color: #a3a3a3; }
        .input-group {
            display: flex;
            gap: 8px;
        }
        textarea.input {
            min-height: 80px;
            resize: vertical;
            width: 100%;
        }
        
        /* Two column layout */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
        
        /* Log viewer */
        .log-viewer {
            background: #1a1a1a;
            color: #e5e5e5;
            padding: 16px;
            border-radius: 8px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry { padding: 2px 0; }
        .log-time { color: #737373; }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #737373;
        }
        .result-box {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <span class="logo">🚀 Coordinator</span>
            <a href="#" class="nav-link">Tasks</a>
            <a href="#" class="nav-link">Workers</a>
        </div>
        <div class="header-right">
            <span id="status" class="badge badge-neutral">Checking...</span>
        </div>
    </header>

    <div class="container">
        <!-- Coordinator Control -->
        <div class="control-panel">
            <div class="control-panel-status">
                <span id="coord-dot" class="status-dot stopped"></span>
                <span id="coord-status">Coordinator Stopped</span>
            </div>
            <button id="start-btn" onclick="startCoordinator()" class="btn btn-success">Start</button>
            <button id="stop-btn" onclick="stopCoordinator()" class="btn btn-danger" disabled>Stop</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="stats">
            <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Queued</div></div>
            <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Running</div></div>
            <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Completed</div></div>
            <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Failed</div></div>
            <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Workers</div></div>
        </div>

        <div class="grid-2">
            <!-- New Task -->
            <div class="section">
                <div class="section-header">
                    <span class="section-title">New Task</span>
                </div>
                <div class="list">
                    <div style="padding: 20px;">
                        <textarea id="prompt" class="input" placeholder="Enter task prompt..."></textarea>
                        <div style="margin-top: 12px;">
                            <button onclick="enqueueTask()" class="btn btn-primary">Add Task</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Workers -->
            <div class="section">
                <div class="section-header">
                    <span class="section-title">Workers</span>
                    <div class="input-group">
                        <input type="number" id="workerCount" value="1" min="0" max="10" class="input" style="width:60px">
                        <button onclick="scaleWorkers()" class="btn">Scale</button>
                    </div>
                </div>
                <div class="list" id="workers">
                    <div class="list-empty">No workers</div>
                </div>
            </div>
        </div>

        <!-- Tasks -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">Tasks</span>
            </div>
            <div class="list" id="tasks">
                <div class="list-empty">No tasks</div>
            </div>
        </div>

        <!-- Activity Log -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">Activity Log</span>
            </div>
            <div class="log-viewer" id="log">
                <div class="list-empty" style="color: #737373;">Waiting for events...</div>
            </div>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Task Details</span>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="taskDetails"></div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('coordToken') || '';
        let logs = [];
        let coordRunning = false;

        async function checkCoordinatorStatus() {
            try {
                const res = await fetch('/dashboard/status');
                const data = await res.json();
                coordRunning = data.running;
                updateCoordUI();
                if (data.logs && data.logs.length > 0) {
                    data.logs.slice(-10).forEach(log => {
                        const msg = log.replace(/^\[.*?\] /, '');
                        if (!logs.find(l => l.msg === msg)) {
                            logs.unshift({ time: new Date().toLocaleTimeString(), msg });
                        }
                    });
                    if (logs.length > 50) logs = logs.slice(0, 50);
                    renderLogs();
                }
            } catch (e) {
                coordRunning = false;
                updateCoordUI();
            }
        }

        function updateCoordUI() {
            const dot = document.getElementById('coord-dot');
            const statusText = document.getElementById('coord-status');
            const statusBadge = document.getElementById('status');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            
            if (coordRunning) {
                dot.className = 'status-dot running';
                statusText.textContent = 'Coordinator Running';
                statusBadge.textContent = 'Running';
                statusBadge.className = 'badge badge-success';
                startBtn.disabled = true;
                stopBtn.disabled = false;
            } else {
                dot.className = 'status-dot stopped';
                statusText.textContent = 'Coordinator Stopped';
                statusBadge.textContent = 'Stopped';
                statusBadge.className = 'badge badge-danger';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        async function startCoordinator() {
            try {
                const res = await fetch('/dashboard/start', { method: 'POST' });
                const data = await res.json();
                if (data.error) {
                    alert('Failed: ' + data.error);
                } else {
                    addLog('Coordinator starting...');
                    setTimeout(checkCoordinatorStatus, 1000);
                }
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        async function stopCoordinator() {
            try {
                const res = await fetch('/dashboard/stop', { method: 'POST' });
                const data = await res.json();
                if (data.error) {
                    alert('Failed: ' + data.error);
                } else {
                    addLog('Coordinator stopping...');
                    setTimeout(checkCoordinatorStatus, 1000);
                }
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        function addLog(msg) {
            logs.unshift({ time: new Date().toLocaleTimeString(), msg });
            if (logs.length > 50) logs.pop();
            renderLogs();
        }

        function renderLogs() {
            const el = document.getElementById('log');
            if (logs.length === 0) {
                el.innerHTML = '<div style="color: #737373;">Waiting for events...</div>';
                return;
            }
            el.innerHTML = logs.map(l => 
                `<div class="log-entry"><span class="log-time">${l.time}</span> ${l.msg}</div>`
            ).join('');
        }

        async function api(path, opts = {}) {
            opts.headers = { ...opts.headers, 'X-Coordinator-Token': token };
            const res = await fetch(path, opts);
            if (!res.ok) throw new Error(res.statusText);
            return res.json();
        }

        async function refresh() {
            if (!coordRunning) return;
            try {
                const stats = await api('/api/stats');
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${stats.tasks?.queued || 0}</div><div class="stat-label">Queued</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.tasks?.running || 0}</div><div class="stat-label">Running</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.tasks?.completed || 0}</div><div class="stat-label">Completed</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.tasks?.failed || 0}</div><div class="stat-label">Failed</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.workers?.total || 0}</div><div class="stat-label">Workers</div></div>
                `;

                const workers = await api('/api/workers');
                document.getElementById('workers').innerHTML = workers?.length ? workers.map(w => `
                    <div class="list-item">
                        <div class="list-item-info">
                            <span class="status-dot ${w.status}"></span>
                            <span class="list-item-name">${w.id}</span>
                            <span class="list-item-meta">Tasks: ${w.tasks_completed || 0}</span>
                        </div>
                        <span class="badge badge-${w.status === 'busy' ? 'info' : 'neutral'}">${w.status}</span>
                    </div>
                `).join('') : '<div class="list-empty">No workers</div>';

                const tasks = await api('/api/tasks?limit=20');
                document.getElementById('tasks').innerHTML = tasks?.length ? tasks.map(t => `
                    <div class="list-item" onclick="showTask('${t.id}')" style="cursor:pointer">
                        <div class="list-item-info">
                            <span class="status-dot ${t.status === 'completed' ? 'running' : t.status === 'failed' ? 'stopped' : 'idle'}"></span>
                            <span class="list-item-name">${t.id.slice(0,8)}</span>
                            <span class="list-item-meta" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(t.prompt || '')}</span>
                        </div>
                        <span class="badge badge-${t.status === 'completed' ? 'success' : t.status === 'failed' ? 'danger' : t.status === 'running' ? 'info' : 'warning'}">${t.status}</span>
                    </div>
                `).join('') : '<div class="list-empty">No tasks</div>';
            } catch (e) {
                // Coordinator might have stopped
            }
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        async function enqueueTask() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return alert('Prompt required');
            if (!coordRunning) return alert('Start coordinator first');
            try {
                const task = await api('/api/enqueue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                document.getElementById('prompt').value = '';
                addLog(`Task ${task.id.slice(0,8)} enqueued`);
                refresh();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        async function scaleWorkers() {
            if (!coordRunning) return alert('Start coordinator first');
            const count = document.getElementById('workerCount').value;
            try {
                await api('/api/scale?workers=' + count, { method: 'POST' });
                addLog(`Scaling to ${count} workers`);
                refresh();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        async function showTask(id) {
            if (!coordRunning) return;
            try {
                const task = await api('/api/task?id=' + id);
                document.getElementById('taskDetails').innerHTML = `
                    <p style="margin-bottom:12px"><strong>ID:</strong> <code>${task.id}</code></p>
                    <p style="margin-bottom:12px"><strong>Status:</strong> <span class="badge badge-${task.status === 'completed' ? 'success' : task.status === 'failed' ? 'danger' : 'info'}">${task.status}</span></p>
                    <p style="margin-bottom:12px"><strong>Created:</strong> ${new Date(task.created_at).toLocaleString()}</p>
                    ${task.completed_at ? `<p style="margin-bottom:12px"><strong>Completed:</strong> ${new Date(task.completed_at).toLocaleString()}</p>` : ''}
                    ${task.worker_id ? `<p style="margin-bottom:12px"><strong>Worker:</strong> ${task.worker_id}</p>` : ''}
                    <p style="margin-bottom:8px"><strong>Prompt:</strong></p>
                    <div class="result-box">${escapeHtml(task.prompt || '')}</div>
                    ${task.result ? `<p style="margin:16px 0 8px"><strong>Result:</strong></p><div class="result-box">${escapeHtml(task.result)}</div>` : ''}
                    ${task.error ? `<p style="margin:16px 0 8px"><strong>Error:</strong></p><div class="result-box" style="background:#fee2e2;color:#dc2626">${escapeHtml(task.error)}</div>` : ''}
                `;
                document.getElementById('taskModal').classList.add('active');
            } catch (e) {
                alert('Failed to load task');
            }
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        setInterval(() => {
            checkCoordinatorStatus();
            if (coordRunning) refresh();
        }, 3000);
        checkCoordinatorStatus();
    </script>
</body>
</html>
